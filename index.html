<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>كتابي</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f5f3ef;color:#252525;font-family:Tahoma,Arial,sans-serif}

header{background:#202d3b;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

.logo{font-size:28px;font-weight:bold}

main{max-width:850px;margin:30px auto;padding:0 15px}

button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-family:inherit}

.primary{background:#ad8752;color:white}

.secondary{background:#e9e5dd;color:#333}

.panel,.hero,.writing{background:white;border:1px solid #e9e4dc;border-radius:13px;padding:22px;margin-bottom:18px}

.hero{text-align:center;padding:35px 20px}

.hero h1{color:#263748}

.hero p{color:#777;line-height:2}

h2{font-size:20px;color:#263748;margin-top:0}

input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:15px}

textarea{min-height:145px;line-height:1.9}

label{font-size:14px;color:#555}

.notice{background:#f4f0e8;color:#685536;padding:12px;border-radius:8px;margin-top:12px;line-height:1.8;overflow-wrap:anywhere}

.hidden{display:none!important}

.actions{display:flex;gap:9px;flex-wrap:wrap}

.writing h3{color:#263748}

.writing p{white-space:pre-wrap;line-height:2}

.meta{color:#888;font-size:12px;margin-bottom:12px}

footer{text-align:center;color:#888;padding:30px}

</style>

</head>

<body>

<header>

 <div>

  <div class="logo">كتابي</div>

  <small>كل حكاية تستحق أن تُروى</small>

 </div>

 <div class="actions">

  <button class="secondary" onclick="go('writings')">اكتشف</button>

  <button class="primary" id="loginButton" onclick="toggleLogin()">دخول / حساب جديد</button>

  <button class="secondary hidden" id="logoutButton" onclick="logout()">خروج</button>

 </div>

</header>

<main>

 <section class="hero">

  <h1>أهلاً بك في كتابي</h1>

  <p>مساحتك لتكتب أفكارك وذكرياتك وتجاربك وتشاركها مع الآخرين.</p>

  <button class="primary" onclick="go('writePanel')">اكتب حكايتك</button>

 </section>

 <section class="panel hidden" id="loginPanel">

  <h2>حسابك في كتابي</h2>

  <label>اسم حساب إنستغرام بدون @</label>

  <input id="username" maxlength="30" placeholder="مثلاً ahmed_iraq">

  <label>كلمة المرور (8 أحرف على الأقل)</label>

  <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">

  <div class="actions">

   <button class="primary" onclick="register()">إنشاء حساب</button>

   <button class="secondary" onclick="login()">دخول</button>

  </div>

  <div id="loginMessage" class="notice hidden"></div>

  <p style="font-size:12px;color:#888;line-height:1.8">احتفظ بكلمة المرور، ولا تشاركها مع أحد. اسم إنستغرام هنا ليس إثباتاً لملكية الحساب.</p>

 </section>

 <section class="panel hidden" id="profilePanel">

  <h2>ملفي الشخصي</h2>

  <label>الاسم الظاهر للقراء</label>

  <input id="displayName" placeholder="اسمك">

  <label>نبذة عنك</label>

  <input id="bio" placeholder="نبذة قصيرة">

  <button class="primary" onclick="saveProfile()">حفظ</button>

  <div id="profileMessage" class="notice hidden"></div>

 </section>

 <section class="panel hidden" id="writePanel">

  <h2>أضف صفحة إلى كتابك</h2>

  <label>عنوان الكتابة</label>

  <input id="title" maxlength="150" placeholder="عنوان قصتك">

  <label>التصنيف</label>

  <select id="category">

   <option>خواطر</option><option>الحياة</option><option>التجارب</option>

   <option>الذكريات</option><option>الحب</option><option>النجاح</option>

   <option>رسائل</option><option>أخرى</option>

  </select>

  <label>انشر باسم</label>

  <select id="identity">

   <option value="profile">اسمي الشخصي</option>

   <option value="alias">اسم مستعار</option>

   <option value="anonymous">مجهول</option>

  </select>

  <div id="aliasBox" class="hidden">

   <label>الاسم المستعار</label>

   <input id="alias" placeholder="اسم مستعار">

  </div>

  <label>نص الكتابة</label>

  <textarea id="body" placeholder="اكتب حكايتك هنا..."></textarea>

  <button class="primary" onclick="publish()">نشر الكتابة</button>

  <div id="publishMessage" class="notice hidden"></div>

 </section>

 <section id="writings">

  <h2>أحدث الكتابات</h2>

  <div id="posts"><div class="notice">جارٍ تحميل الكتابات...</div></div>

 </section>

</main>

<footer>كتابي © 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script>

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function go(id){

 document.getElementById(id).scrollIntoView({behavior:"smooth"});

}

function msg(id,text){

 const el=document.getElementById(id);

 el.textContent=text;

 el.classList.remove("hidden");

}

function hide(id){

 document.getElementById(id).classList.add("hidden");

}

function toggleLogin(){

 document.getElementById("loginPanel").classList.toggle("hidden");

 go("loginPanel");

}

function credentials(){

 const username=document.getElementById("username").value.trim().toLowerCase();

 const password=document.getElementById("password").value;

 if(!/^[a-z0-9._]{1,30}$/.test(username)){

  throw new Error("اكتب اسم المستخدم بحروف إنجليزية أو أرقام أو نقطة أو شرطة سفلية.");

 }

 if(password.length<8){

  throw new Error("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");

 }

 return {

  username:username,

  password:password,

  email:username+"@login.kitabi.invalid"

 };

}

document.getElementById("identity").addEventListener("change",function(){

 document.getElementById("aliasBox").classList.toggle("hidden",this.value!=="alias");

});

async function register(){

 hide("loginMessage");

 try{

  const c=credentials();

  const {data,error}=await db.auth.signUp({

   email:c.email,

   password:c.password

  });

  if(error)throw error;

  if(!data.session){

   msg("loginMessage","الحساب لم يدخل تلقائياً. تأكد من تعطيل تأكيد البريد الإلكتروني في Supabase.");

   return;

  }

  currentUser=data.user;

  const {error:profileError}=await db.from("profiles").update({

   instagram_username:c.username,

   display_name:c.username

  }).eq("id",currentUser.id);

  if(profileError)throw profileError;

  updateUI();

  await loadProfile();

  await loadWritings();

  msg("loginMessage","تم إنشاء الحساب والدخول بنجاح.");

 }catch(e){

  msg("loginMessage","تعذر إنشاء الحساب: "+e.message);

 }

}

async function login(){

 hide("loginMessage");

 try{

  const c=credentials();

  const {data,error}=await db.auth.signInWithPassword({

   email:c.email,

   password:c.password

  });

  if(error)throw error;

  currentUser=data.user;

  updateUI();

  await loadProfile();

  await loadWritings();

  msg("loginMessage","تم تسجيل الدخول بنجاح.");

 }catch(e){

  msg("loginMessage","تعذر الدخول: "+e.message);

 }

}

async function logout(){

 await db.auth.signOut();

 currentUser=null;

 updateUI();

 location.reload();

}

async function loadProfile(){

 if(!currentUser)return;

 const {data,error}=await db.from("profiles")

  .select("display_name,bio")

  .eq("id",currentUser.id).maybeSingle();

 if(error){msg("profileMessage",error.message);return;}

 if(data){

  document.getElementById("displayName").value=data.display_name||"";

  document.getElementById("bio").value=data.bio||"";

 }

}

async function saveProfile(){

 if(!currentUser)return;

 const display_name=document.getElementById("displayName").value.trim();

 const bio=document.getElementById("bio").value.trim();

 if(!display_name){msg("profileMessage","اكتب اسم العرض أولاً.");return;}

 const {error}=await db.from("profiles").update({display_name,bio})

  .eq("id",currentUser.id);

 if(error)msg("profileMessage","تعذر الحفظ: "+error.message);

 else msg("profileMessage","تم حفظ بياناتك.");

}

async function publish(){

 hide("publishMessage");

 if(!currentUser){msg("publishMessage","سجّل الدخول أولاً.");return;}

 const title=document.getElementById("title").value.trim();

 const body=document.getElementById("body").value.trim();

 const category=document.getElementById("category").value;

 const identity_mode=document.getElementById("identity").value;

 const alias=document.getElementById("alias").value.trim();

 if(!body){msg("publishMessage","اكتب نص الكتابة أولاً.");return;}

 if(identity_mode==="alias"&&!alias){msg("publishMessage","اكتب الاسم المستعار.");return;}

 const {error}=await db.from("writings").insert({

  user_id:currentUser.id,title,body,category,identity_mode,

  alias:identity_mode==="alias"?alias:null

 });

 if(error){msg("publishMessage","تعذر النشر: "+error.message);return;}

 document.getElementById("title").value="";

 document.getElementById("body").value="";

 document.getElementById("alias").value="";

 msg("publishMessage","تم نشر كتابتك بنجاح.");

 await loadWritings();

}

function safe(v){

 return String(v??"").replace(/[&<>"']/g,c=>({

  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

 }[c]));

}

async function loadWritings(){

 const box=document.getElementById("posts");

 const {data,error}=await db.from("writings")

  .select("id,title,body,category,identity_mode,alias,created_at,profiles(display_name)")

  .order("created_at",{ascending:false});

 if(error){

  box.textContent="تعذر تحميل الكتابات: "+error.message;

  return;

 }

 if(!data||!data.length){

  box.innerHTML='<div class="notice">لا توجد كتابات منشورة بعد. كن أول من يكتب.</div>';

  return;

 }

 box.innerHTML=data.map(p=>{

  let author="مجهول";

  if(p.identity_mode==="profile")author=p.profiles?.display_name||"كاتب";

  if(p.identity_mode==="alias")author=p.alias||"اسم مستعار";

  const date=new Date(p.created_at).toLocaleDateString("ar-IQ");

  return `<article class="writing">

   <div class="meta">${safe(author)} · ${safe(p.category)} · ${safe(date)}</div>

   <h3>${safe(p.title||"بدون عنوان")}</h3>

   <p>${safe(p.body)}</p>

  </article>`;

 }).join("");

}

function updateUI(){

 document.getElementById("loginButton").classList.toggle("hidden",!!currentUser);

 document.getElementById("logoutButton").classList.toggle("hidden",!currentUser);

 document.getElementById("writePanel").classList.toggle("hidden",!currentUser);

 document.getElementById("profilePanel").classList.toggle("hidden",!currentUser);

}

async function start(){

 try{

  const {data,error}=await db.auth.getSession();

  if(error)throw error;

  currentUser=data.session?.user||null;

  updateUI();

  if(currentUser)await loadProfile();

  await loadWritings();

 }catch(e){

  msg("loginMessage","تعذر الاتصال: "+e.message);

 }

}

db.auth.onAuthStateChange((_event,session)=>{

 currentUser=session?.user||null;

 updateUI();

});

start();

</script>

</body>

</html>
