<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتابي — مكتبة الحكايات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae0;--paper:#fbf7ef;--paper2:#f3ece0;--ink:#22252a;--muted:#6c665d;--navy:#1e2d3d;--navy2:#2b3f54;--gold:#a87f47;--border:#e2dacb;--shadow:0 18px 42px rgba(24,33,44,.15)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.75}
header{background:var(--navy);color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column}
.logo{font:700 30px Amiri,serif;line-height:1.15}
.brand small{color:#d5cfc4;font-size:12px}
main{max-width:1060px;margin:28px auto;padding:0 16px}
button{border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font:700 14.5px Tajawal,sans-serif;transition:.18s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--gold);color:white}
.primary:hover:not(:disabled){background:#8f6834}
.secondary{background:#e7e0d3;color:var(--navy)}
.ghost{background:#ffffff1c;color:white;border:1px solid #ffffff40}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel,.hero{background:var(--paper);border:1px solid var(--border);border-radius:15px;padding:24px;margin-bottom:22px;box-shadow:0 10px 28px #1e2d3d12}
.hero{text-align:center;padding:40px 22px;background:linear-gradient(#fdfaf3,#f5efe3)}
.hero h1{font:700 clamp(30px,4vw,42px) Amiri,serif;color:var(--navy);margin:0 0 10px}
.hero p{color:var(--muted);max-width:620px;margin:0 auto 22px;font-size:16px;line-height:1.95}
h2{font:700 25px Amiri,serif;color:var(--navy);margin:0 0 14px}
input,textarea,select{width:100%;padding:12px 14px;margin:7px 0 15px;border:1px solid #d5cbb9;border-radius:9px;background:#fffdf9;color:var(--ink);font:15px Tajawal,sans-serif}
textarea{min-height:165px;line-height:1.95}
label{display:block;font-size:14px;font-weight:700;color:#4a453e}
.notice{background
        <section class="panel hidden" id="writePanel">
<h2>أضف صفحة إلى كتابك</h2>
<label>عنوان الكتابة</label>
<input id="title" maxlength="150" placeholder="عنوان قصتك">
<label>التصنيف</label>
<select id="category">
<option>خواطر</option><option>الحياة</option><option>التجارب</option><option>الذكريات</option><option>الحب</option><option>النجاح</option><option>رسائل</option><option>أخرى</option>
</select>
<label>انشر باسم</label>
<select id="identity">
<option value="profile">اسمي الشخصي</option>
<option value="alias">اسم مستعار</option>
<option value="anonymous">مجهول</option>
</select>
<div id="aliasBox" class="hidden">
<label>الاسم المستعار</label>
<input id="alias" placeholder="اسم مستعار">
</div>
<label>نص الكتابة</label>
<textarea id="body" placeholder="اكتب حكايتك هنا..."></textarea>
<button class="primary" onclick="publish()">نشر الكتابة</button>
<div id="publishMessage" class="notice hidden"></div>
</section>
<section id="writings">
<h2>مكتبة الحكايات</h2>
<div class="library-tools">
<input class="search-box" id="searchInput" type="search" placeholder="ابحث بالعنوان أو اسم الكاتب..." oninput="renderLibrary()">
<select class="cat-filter" id="categoryFilter" onchange="renderLibrary()">
<option value="ALL">كل التصنيفات</option><option>خواطر</option><option>الحياة</option><option>التجارب</option><option>الذكريات</option><option>الحب</option><option>النجاح</option><option>رسائل</option><option>أخرى</option>
</select>
</div>
<div id="posts"><div class="notice">جارٍ تحميل الكتابات...</div></div>
</section>
</div>
</main>
<footer>كتابي ©️ 2026</footer>
<div id="measureArea"><div class="measure-page" id="measurePage"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script src="config.js"></script>
<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let allWritings = [];
let currentStory = null;
let pageFlip = null;
let resizeTimer = null;

function $(id){
return document.getElementById(id)
}

function isMobileReader(){
return window.innerWidth <= 700
}

function go(id){
if(!$('readerView').classList.contains('hidden'))closeReader(false);
const el=$(id);
if(el)el.scrollIntoView({behavior:'smooth'})
}

function openLibraryView(){
closeReader(true);
$('writings').scrollIntoView({behavior:'smooth'})
}

function msg(id,text){
const el=$(id);
el.textContent=text;
el.classList.remove('hidden')
}

function hide(id){
$(id).classList.add('hidden')
}

function toggleLogin(){
if(!$('readerView').classList.contains('hidden'))closeReader(false);
$('loginPanel').classList.toggle('hidden');
go('loginPanel')
}

function credentials(){
const username=$('username').value.trim().toLowerCase();
const password=$('password').value;
if(!/^[a-z0-9._]{1,30}$/.test(username)){
throw new Error('اكتب اسم المستخدم بحروف إنجليزية أو أرقام أو نقطة أو شرطة سفلية.')
}
if(password.length<8){
throw new Error('كلمة المرور يجب أن تكون 8 أحرف على الأقل.')
}
return{
username:username,
password:password,
email:username+'@login.kitabi.invalid'
}
}

$('identity').addEventListener('change',function(){
$('aliasBox').classList.toggle('hidden',this.value!=='alias')
});

async function register(){
hide('loginMessage');
try{
const c=credentials();
const{data,error}=await db.auth.signUp({
email:c.email,
password:c.password
});
if(error)throw error;
if(!data.session){
msg('loginMessage','الحساب لم يدخل تلقائياً. تأكد من تعطيل تأكيد البريد الإلكتروني في Supabase.');
return
}
currentUser=data.user;
const{error:profileError}=await db.from('profiles').update({
instagram_username:c.username,
display_name:c.username
}).eq('id',currentUser.id);
if(profileError)throw profileError;
updateUI();
await loadProfile();
await loadWritings();
msg('loginMessage','تم إنشاء الحساب والدخول بنجاح.')
}catch(e){
msg('loginMessage','تعذر إنشاء الحساب: '+e.message)
}
}

async function login(){
hide('loginMessage');
try{
const c=credentials();
const{data,error}=await db.auth.signInWithPassword({
email:c.email,
password:c.password
});
if(error)throw error;
currentUser=data.user;
updateUI();
await loadProfile();
await loadWritings();
msg('loginMessage','تم تسجيل الدخول بنجاح.')
}catch(e){
msg('loginMessage','تعذر الدخول: '+e.message)
}
}

async function logout(){
await db.auth.signOut();
currentUser=null;
updateUI();
location.reload()
}

async function loadProfile(){
if(!currentUser)return;
const{data,error}=await db.from('profiles')
.select('display_name,bio')
.eq('id',currentUser.id).maybeSingle();
if(error){msg('profileMessage',error.message);return}
if(data){
$('displayName').value=data.display_name||'';
$('bio').value=data.bio||''
}
}
  async function saveProfile(){
if(!currentUser)return;
const display_name=$('displayName').value.trim();
const bio=$('bio').value.trim();
if(!display_name){msg('profileMessage','اكتب اسم العرض أولاً.');return}
const{error}=await db.from('profiles').update({display_name,bio})
.eq('id',currentUser.id);
if(error)msg('profileMessage','تعذر الحفظ: '+error.message);
else msg('profileMessage','تم حفظ بياناتك.')
}

async function publish(){
hide('publishMessage');
if(!currentUser){msg('publishMessage','سجّل الدخول أولاً.');return}
const title=$('title').value.trim();
const body=$('body').value.trim();
const category=$('category').value;
const identity_mode=$('identity').value;
const alias=$('alias').value.trim();
if(!body){msg('publishMessage','اكتب نص الكتابة أولاً.');return}
if(identity_mode==='alias'&&!alias){msg('publishMessage','اكتب الاسم المستعار.');return}
const{error}=await db.from('writings').insert({
user_id:currentUser.id,title,body,category,identity_mode,
alias:identity_mode==='alias'?alias:null
});
if(error){
msg('publishMessage','تعذر النشر: '+error.message);
return
}
$('title').value='';
$('body').value='';
$('alias').value='';
msg('publishMessage','تم نشر كتابتك بنجاح.');
await loadWritings();
}

function safe(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]))
}

function getAuthorName(p){
if(p.identity_mode==='profile')return p.profiles?.display_name||'كاتب';
if(p.identity_mode==='alias')return p.alias||'اسم مستعار';
return 'مجهول'
}

function renderLibrary(){
const box=$('posts');
const q=$('searchInput').value.trim().toLowerCase();
const cat=$('categoryFilter').value;

const filtered=allWritings.filter(p=>
(cat==='ALL'||p.category===cat)&&
(!q||
(p.title||'').toLowerCase().includes(q)||
getAuthorName(p).toLowerCase().includes(q)||
(p.body||'').toLowerCase().includes(q))
);

if(!filtered.length){
box.innerHTML='<div class="notice">لا توجد حكايات مطابقة للبحث أو التصنيف المحدد.</div>';
return
}

box.innerHTML='<div class="books-grid">'+filtered.map(p=>{
const date=new Date(p.created_at).toLocaleDateString('ar-IQ');
return `<article class="book-card">
<div>
<div class="book-top">
<span class="book-category">${safe(p.category||'أخرى')}</span>
<span class="book-date">${safe(date)}</span>
</div>
<h3 class="book-title">${safe(p.title||'بدون عنوان')}</h3>
<p class="book-excerpt">${safe(p.body||'')}</p>
</div>
<div class="book-footer">
<div class="book-author">بقلم: ${safe(getAuthorName(p))}</div>
<button type="button" class="read-btn" data-id="${safe(p.id)}" onclick="openStoryById(this.dataset.id)">اقرأ الحكاية</button>
</div>
</article>`
}).join('')+'</div>'
}
async function loadWritings(){
const box=$('posts');
const{data,error}=await db.from('writings')
.select('id,title,body,category,identity_mode,alias,created_at,profiles!writings_user_id_fkey(display_name)')
.order('created_at',{ascending:false});

if(error){
box.textContent='تعذر تحميل الكتابات: '+error.message;
return
}
allWritings=data||[];
renderLibrary();
if(!allWritings.length)
box.innerHTML='<div class="notice">لا توجد كتابات منشورة بعد. كن أول من يكتب.</div>'
}

function paginateByRenderedHeight(raw){
const source=(raw||'').replace(/\r\n/g,'\n').trim();
if(!source)return['لا يوجد نص في هذه الحكاية.'];

const measure=$('measurePage');
const mobile=isMobileReader();
const pageWidth=mobile?Math.min(window.innerWidth-70,390):390;
measure.style.width=pageWidth+'px';
measure.style.height=(mobile?560:620)+'px';

const words=source.split(/(\s+)/);
const pages=[];
let current='';

for(let i=0;i<words.length;){
let token=words[i];
let candidate=current+token;
measure.textContent=candidate;

if(measure.scrollHeight<=measure.clientHeight+1){
current=candidate;
i++;
continue
}

if(!current.trim()){
current=token;
i++;
continue
}

pages.push(current.trim());
current='';
while(i<words.length&&/^\s+$/.test(words[i]))i++
}

if(current.trim())pages.push(current.trim());
return pages.length?pages:[source]
}

function destroyFlip(){
if(pageFlip){
try{pageFlip.destroy()}catch(e){}
pageFlip=null
}
$('flipbook').innerHTML=''
}
  function buildFlipbook(startPage=0){
if(!currentStory)return;
destroyFlip();

const pages=paginateByRenderedHeight(currentStory.body);
const host=$('flipbook');

pages.forEach((text,i)=>{
const page=document.createElement('div');
page.className='page';

const content=document.createElement('div');
content.className='page-content';
content.textContent=text;

const footer=document.createElement('div');
footer.className='page-footer';
footer.textContent = `${i+1} · كتابي`;

page.append(content,footer);
host.appendChild(page)
});

const mobile=isMobileReader();
const width=mobile?Math.max(280,Math.min(390,window.innerWidth-42)):420;
const height=mobile?560:620;

pageFlip=new St.PageFlip(host,{
width,
height,
size:'stretch',
minWidth:280,
maxWidth:900,
minHeight:420,
maxHeight:700,
drawShadow:true,
flippingTime:750,
usePortrait:true,
startPage:Math.min(startPage,pages.length-1),
autoSize:true,
maxShadowOpacity:.35,
showCover:false,
mobileScrollSupport:true,
swipeDistance:30,
useMouseEvents:true
});

pageFlip.loadFromHTML(host.querySelectorAll('.page'));
pageFlip.on('flip',e=>updateReaderControls(e.data,pages.length));
updateReaderControls(Math.min(startPage,pages.length-1),pages.length)
}

function updateReaderControls(index,total){
$('pageIndicator').textContent = `صفحة ${index+1} من ${total}`;
$('prevPageBtn').disabled=index<=0;
$('nextPageBtn').disabled=index>=total-1
}

function openStoryById(id){
const story=allWritings.find(x=>String(x.id)===String(id));
if(!story)return;

currentStory=story;
$('readerTitle').textContent=story.title||'بدون عنوان';
$('readerMeta').textContent = `الكاتب: ${getAuthorName(story)} · التصنيف: ${story.category||'أخرى'} · ${new Date(story.created_at).toLocaleDateString('ar-IQ')}`;

$('mainCatalogView').classList.add('hidden');
$('readerView').classList.remove('hidden');

buildFlipbook(0);
$('readerView').scrollIntoView({behavior:'smooth'})
}

function closeReader(scroll=true){
$('readerView').classList.add('hidden');
$('mainCatalogView').classList.remove('hidden');
destroyFlip();
currentStory=null;
if(scroll)$('writings').scrollIntoView({behavior:'smooth'})
}

function nextPage(){
if(pageFlip&&pageFlip.getCurrentPageIndex()<pageFlip.getPageCount()-1)
pageFlip.flipNext('bottom')
}

function prevPage(){
if(pageFlip&&pageFlip.getCurrentPageIndex()>0)
pageFlip.flipPrev('bottom')
}

window.addEventListener('resize',()=>{
if(!$('readerView').classList.contains('hidden')&&currentStory){
clearTimeout(resizeTimer);
const oldPage=pageFlip?pageFlip.getCurrentPageIndex():0;
resizeTimer=setTimeout(()=>buildFlipbook(oldPage),250)
}
});

document.addEventListener('keydown',e=>{
if($('readerView').classList.contains('hidden'))return;
if(e.key==='ArrowLeft')nextPage();
if(e.key==='ArrowRight')prevPage();
if(e.key==='Escape')closeReader(true)
});

function updateUI(){
$('loginButton').classList.toggle('hidden',!!currentUser);
$('logoutButton').classList.toggle('hidden',!currentUser);
$('writePanel').classList.toggle('hidden',!currentUser);
$('profilePanel').classList.toggle('hidden',!currentUser)
}

async function start(){
try{
const{data,error}=await db.auth.getSession();
if(error)throw error;
currentUser=data.session?.user||null;
updateUI();
if(currentUser)await loadProfile();
await loadWritings()
}catch(e){
msg('loginMessage','تعذر الاتصال: '+e.message)
}
}

db.auth.onAuthStateChange((_event,session)=>{
currentUser=session?.user||null;
updateUI()
});

start();
</script>
</body>
</html>
